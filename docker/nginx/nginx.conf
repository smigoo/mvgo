# Nginx 统一入口配置
# 路由规则：
#   /api/progress|phase2|vue3|demo|preview|models → Node.js:13030（AI 引擎）
#   其余 /api/* → Java:8080（业务 CRUD）
#   / → 前端:2610

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SSE 代理优化
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    upstream frontend {
        server frontend:2610;
    }

    upstream backend_node {
        server backend-node:13030;
    }

    upstream backend_java {
        server backend-java:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # ─── 前端静态资源 ───
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── AI 引擎路由（Node.js） ───
        location /api/progress {
            proxy_pass http://backend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # SSE 特殊处理
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            tcp_nodelay on;
        }

        location /api/phase2 {
            proxy_pass http://backend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/vue3 {
            proxy_pass http://backend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/demo {
            proxy_pass http://backend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/preview {
            proxy_pass http://backend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/models {
            proxy_pass http://backend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── 业务路由（Java） ───
        location /api {
            proxy_pass http://backend_java;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
