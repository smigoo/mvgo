# Nginx 统一入口配置
# 路由规则：
#   /api/progress → Node.js:13030（AI 引擎 SSE，按 sessionId 鉴权）
#   /api/mc-spec  → Node.js:13030（微码规范检查，2026-09-10 新增）
#   其余 /api/* → Java:8080（鉴权 + 业务 CRUD + 反向代理 AI 管线）
#   / → 前端:2610
# 说明：phase2/vue3/demo/preview/models/v2 等 AI 管线已由 Java NodeProxyController
#       统一代理到 Node，前端只需访问 Java(8080) 单一入口，不再直连 Node。

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SSE 代理优化
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    upstream frontend {
        server frontend:2610;
    }

    upstream backend_node {
        server backend-node:13030;
    }

    upstream backend_java {
        server backend-java:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # ─── 前端静态资源 ───
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── AI 引擎 SSE 路由（Node.js，仅 progress 直连） ───
        # 其余 AI 管线（phase2/vue3/demo/preview/models/v2）统一经 Java 反向代理，不在此直连
        location /api/progress {
            proxy_pass http://backend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE 特殊处理
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            tcp_nodelay on;
        }

        # ─── 微码组件规范检查（Node.js，2026-09-10 新增） ───
        # 必须排在统一 /api（Java）之前：Java 8080 无 /api/mc-spec 路由，
        # 否则前端点「微码规范检查」会直接 404。鉴权由 Node 侧 SessionGuard 自理（同源 cookie）。
        location /api/mc-spec {
            proxy_pass http://backend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── 统一业务入口（Java） ───
        # Java 负责鉴权(SessionGuard)、统一 Result<T> 信封，并将 AI 管线反向代理到 Node
        location /api {
            proxy_pass http://backend_java;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
