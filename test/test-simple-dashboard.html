<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单监控大屏测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f1216 0%, #1a1f2e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      padding: 20px 0 30px;
      border-bottom: 2px solid #00d2ff;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 32px;
      color: #00d2ff;
      margin-bottom: 8px;
    }
    
    .header p {
      color: #8b949e;
      font-size: 14px;
    }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }
    
    .stat-card .label {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 12px;
    }
    
    .stat-card .value {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    .stat-card .trend {
      font-size: 13px;
    }
    
    .trend.up { color: #00e676; }
    .trend.down { color: #f85149; }
    
    .card-blue .value { color: #00d2ff; }
    .card-green .value { color: #00e676; }
    .card-orange .value { color: #ff9800; }
    
    .chart-area {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="header" data-component="header">
    <h1>智慧监控中心</h1>
    <p>更新时间：2026-08-05 16:45:00</p>
  </header>
  
  <!-- 数据统计卡片区域 -->
  <section class="dashboard-grid">
    <div class="stat-card card-blue" data-component="traffic-card">
      <div class="label">今日访问量</div>
      <div class="value">12,847</div>
      <div class="trend up">↑ 16.3% 较昨日</div>
    </div>
    
    <div class="stat-card card-green" data-component="success-card">
      <div class="label">成功率</div>
      <div class="value">98.7%</div>
      <div class="trend up">↑ 0.2% 较昨日</div>
    </div>
    
    <div class="stat-card card-orange" data-component="alert-card">
      <div class="label">待处理告警</div>
      <div class="value">23</div>
      <div class="trend down">↓ 5 较昨日</div>
    </div>
  </section>
  
  <!-- 图表区域 -->
  <section class="chart-area" data-component="chart">
    <h3 style="margin-bottom: 20px; color: #00d2ff;">实时趋势图</h3>
    <div style="height: 200px; background: rgba(0, 210, 255, 0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
      图表占位区域
    </div>
  </section>
</body>
</html>
