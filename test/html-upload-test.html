<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 上传测试 - 数据卡片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }
    
    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      margin-right: 16px;
    }
    
    .title {
      font-size: 24px;
      font-weight: 600;
      color: #1a202c;
    }
    
    .subtitle {
      font-size: 14px;
      color: #718096;
      margin-top: 4px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    
    .stat-item {
      background: #f7fafc;
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s;
    }
    
    .stat-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }
    
    .stat-label {
      font-size: 14px;
      color: #718096;
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #2d3748;
    }
    
    .stat-trend {
      font-size: 12px;
      color: #48bb78;
      margin-top: 4px;
    }
    
    .chart-container {
      margin-top: 32px;
      padding: 24px;
      background: #f7fafc;
      border-radius: 12px;
    }
    
    .chart-title {
      font-size: 18px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 16px;
    }
    
    .bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 200px;
      gap: 16px;
    }
    
    .bar {
      flex: 1;
      background: linear-gradient(to top, #667eea 0%, #764ba2 100%);
      border-radius: 8px 8px 0 0;
      position: relative;
      transition: all 0.3s;
    }
    
    .bar:hover {
      opacity: 0.8;
    }
    
    .bar-label {
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #718096;
      white-space: nowrap;
    }
    
    .bar-value {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="icon">📊</div>
        <div>
          <div class="title">数据概览</div>
          <div class="subtitle">2026年8月统计</div>
        </div>
      </div>
      
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">总访问量</div>
          <div class="stat-value">12,345</div>
          <div class="stat-trend">↑ 15.3%</div>
        </div>
        
        <div class="stat-item">
          <div class="stat-label">活跃用户</div>
          <div class="stat-value">8,901</div>
          <div class="stat-trend">↑ 8.7%</div>
        </div>
        
        <div class="stat-item">
          <div class="stat-label">转化率</div>
          <div class="stat-value">23.5%</div>
          <div class="stat-trend">↑ 2.1%</div>
        </div>
      </div>
      
      <div class="chart-container">
        <div class="chart-title">月度趋势</div>
        <div class="bar-chart">
          <div class="bar" style="height: 60%;">
            <span class="bar-value">600</span>
            <span class="bar-label">5月</span>
          </div>
          <div class="bar" style="height: 75%;">
            <span class="bar-value">750</span>
            <span class="bar-label">6月</span>
          </div>
          <div class="bar" style="height: 90%;">
            <span class="bar-value">900</span>
            <span class="bar-label">7月</span>
          </div>
          <div class="bar" style="height: 100%;">
            <span class="bar-value">1000</span>
            <span class="bar-label">8月</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
