server {
    listen 80;
    server_name _;

    access_log logs/proxy-access.log main;
    error_log logs/proxy.error.log;

    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    ignore_invalid_headers off;
    client_max_body_size 0;

    root /www;

    # 站点根跳到 mvgo 子路径
    location = / {
        return 302 /mvgo/;
    }

    # 前端入口 HTML：禁止强缓存
    location = /mvgo/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 静态 hash 资源：长缓存
    location /mvgo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 前端 history 路由回退
    location /mvgo/ {
        try_files $uri $uri/ /mvgo/index.html;
    }

    # 兼容预览入口
    location /preview/ {
        try_files $uri $uri/ /mvgo/index.html;
    }

    # SSE：只允许 progress 直连 Node，必须写在 /api 前面
    location /api/progress {
        proxy_pass http://192.168.112.1:13030/api/progress;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header SourceHost $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        tcp_nodelay on;
    }

    # 统一业务入口：全部进 Java
    location /api {
        proxy_pass http://192.168.112.1:8080/api;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header SourceHost $remote_addr;
    }

    # ===== 以下内部服务原样保留（如果当前宿主配置已有这些段，继续保留） =====
    location /nacos {
        proxy_pass http://192.168.112.1:8848/nacos;
        proxy_set_header Host $host;
        proxy_set_header SourceHost $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path /nacos /nacos;
        proxy_redirect http://192.168.112.1:8848/nacos/ /nacos/;
    }

    location /portlet {
        proxy_pass http://192.168.112.1:39680/portlet;
        proxy_set_header SourceHost $remote_addr;
    }

    location /mvbtapi {
        proxy_pass http://192.168.112.1:15503/mvbtapi;
        proxy_set_header SourceHost $remote_addr;
    }

    location /microcode-framework {
        proxy_pass http://192.168.112.2:18080/microcode-framework;
        proxy_set_header SourceHost $remote_addr;
    }
}