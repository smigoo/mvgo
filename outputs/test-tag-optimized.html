<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST Tag 优化方案</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 48px;
      line-height: 1.5;
    }
    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 32px;
      text-align: center;
    }

    /* ---------- 标签基础 ---------- */
    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      padding: 0 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      user-select: none;
      position: relative;
      overflow: hidden;
      cursor: default;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .tag:hover {
      transform: translateY(-1px) scale(1.02);
    }

    /* 1. 渐变微光 */
    .tag-gradient {
      color: #4a2c08;
      background: linear-gradient(135deg, #ffcb52 0%, #ff9f43 100%);
      box-shadow: 0 2px 8px rgba(255, 159, 67, 0.35),
                  inset 0 1px 0 rgba(255,255,255,0.45);
    }

    /* 2. 呼吸脉冲（推荐·动态） */
    .tag-pulse {
      color: #5a2e00;
      background: linear-gradient(135deg, #ffd166 0%, #ff9f43 100%);
      box-shadow: 0 2px 10px rgba(255, 159, 67, 0.42),
                  inset 0 1px 0 rgba(255,255,255,0.45);
      animation: pulse 2.4s ease-in-out infinite;
    }

    /* 3. 流光扫过 */
    .tag-shimmer {
      color: #4a2c08;
      background: linear-gradient(90deg, #ffcb52, #ff9f43, #ffcb52);
      background-size: 200% 100%;
      box-shadow: 0 2px 8px rgba(255, 159, 67, 0.35);
      animation: shimmer 2.5s linear infinite;
    }

    /* 4. 玻璃拟态 */
    .tag-glass {
      color: #8a4a0a;
      background: rgba(255, 177, 66, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 177, 66, 0.45);
      box-shadow: 0 1px 4px rgba(255, 159, 67, 0.2);
    }

    /* 5. 描边胶囊 */
    .tag-outline {
      color: #d97706;
      background: #fff7ed;
      border: 1px solid #fdba74;
      box-shadow: 0 1px 2px rgba(217, 119, 6, 0.12);
    }

    /* ---------- 动画 ---------- */
    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 2px 10px rgba(255, 159, 67, 0.42),
                    inset 0 1px 0 rgba(255,255,255,0.45);
      }
      50% {
        box-shadow: 0 4px 18px rgba(255, 159, 67, 0.58),
                    inset 0 1px 0 rgba(255,255,255,0.45);
      }
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---------- 布局 ---------- */
    .section {
      max-width: 720px;
      margin: 0 auto 40px;
      padding: 24px;
      border-radius: 16px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      opacity: 0.75;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .light {
      background: #f8f9fb;
      color: #1f2328;
    }
    .dark {
      background: #1e1e2e;
      color: #e8e8f0;
    }
    .dark .tag-gradient {
      color: #2a1604;
      box-shadow: 0 2px 10px rgba(255, 159, 67, 0.45);
    }
    .dark .tag-outline {
      color: #ffb74d;
      background: rgba(255, 183, 77, 0.12);
      border-color: rgba(255, 183, 77, 0.45);
    }
    .dark .tag-glass {
      color: #ffd180;
      background: rgba(255, 177, 66, 0.16);
      border-color: rgba(255, 177, 66, 0.35);
    }

    /* ---------- 场景示例（还原截图） ---------- */
    .demo-toolbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .light .demo-toolbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .dark .demo-toolbar { background: #2a2a3c; box-shadow: 0 1px 4px rgba(0,0,0,0.25); }

    .tool-btn {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .light .tool-btn:hover { background: #f3f4f6; }
    .dark .tool-btn:hover { background: #3a3a4f; }

    .tool-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .tool-btn .tag {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
    }
  </style>
</head>
<body>

  <h1>TEST Tag 优化方案</h1>

  <div class="section light">
    <div class="section-title">Light 背景 · 多风格对照</div>
    <div class="row">
      <span class="tag tag-gradient">TEST</span>
      <span class="tag tag-pulse">TEST 推荐</span>
      <span class="tag tag-shimmer">TEST</span>
      <span class="tag tag-glass">TEST</span>
      <span class="tag tag-outline">TEST</span>
    </div>

    <div class="demo-toolbar">
      <div class="tool-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
      </div>
      <div class="tool-btn">
        <span class="tag tag-pulse">TEST</span>
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l2.9-5.6A8.38 8.38 0 0 1 5 11.5a8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <div class="tool-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </div>
    </div>
  </div>

  <div class="section dark">
    <div class="section-title">Dark 背景 · 多风格对照</div>
    <div class="row">
      <span class="tag tag-gradient">TEST</span>
      <span class="tag tag-pulse">TEST 推荐</span>
      <span class="tag tag-shimmer">TEST</span>
      <span class="tag tag-glass">TEST</span>
      <span class="tag tag-outline">TEST</span>
    </div>

    <div class="demo-toolbar">
      <div class="tool-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
      </div>
      <div class="tool-btn">
        <span class="tag tag-pulse">TEST</span>
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l2.9-5.6A8.38 8.38 0 0 1 5 11.5a8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <div class="tool-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </div>
    </div>
  </div>

  <div class="section light" style="margin-top: 24px;">
    <div class="section-title">推荐方案说明</div>
    <ul style="font-size: 13px; margin: 0; padding-left: 18px; line-height: 1.8;">
      <li><strong>tag-pulse（呼吸脉冲）</strong>：最符合"动态"需求，柔和发光，不刺眼，适合提示"测试模式"这类状态。</li>
      <li><strong>tag-shimmer（流光扫过）</strong>：更活泼，吸引注意力，适合强提示。</li>
      <li><strong>tag-glass（玻璃拟态）</strong>：适合暗色/现代风格界面，低侵入感。</li>
      <li><strong>tag-outline（描边胶囊）</strong>：最克制，适合正式/商务场景。</li>
    </ul>
  </div>

</body>
</html>
