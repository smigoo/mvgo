<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台按钮优化预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: center;
      background: #f8f9fb;
      color: #1f2328;
    }

    h1 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
    p { font-size: 13px; opacity: 0.7; margin: 0 0 24px; }

    .header-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .ghost-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      color: #6b7280;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }
    .ghost-btn:hover {
      border-color: #3b82f6;
      color: #3b82f6;
      background: #eff6ff;
    }

    /* ===== 优化后的工作台按钮（工作台主题色：紫）===== */
    .workbench-toggle-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      background: #4f46e5;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.35);
      transition:
        border-color 0.2s ease,
        color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
      flex-shrink: 0;
    }
    .workbench-toggle-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.45);
      transform: translateY(-1px);
    }

    /* ===== TEST 流光角标 ===== */
    .workbench-test-badge {
      position: absolute;
      top: -8px;
      right: -12px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 9999px;
      color: #4a2c08;
      letter-spacing: 0.5px;
      pointer-events: none;
      background: linear-gradient(90deg, #ffcb52, #ff9f43, #ffcb52);
      background-size: 200% 100%;
      box-shadow: 0 2px 8px rgba(255, 159, 67, 0.35);
      animation: test-badge-shimmer 2.5s linear infinite;
    }

    @keyframes test-badge-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3b82f6;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
    }

    .label {
      font-size: 12px;
      margin-left: 6px;
      color: #374151;
    }

    .dark-section {
      background: #1e1e2e;
      color: #e8e8f0;
      padding: 24px;
      border-radius: 16px;
    }
    .dark-section .header-bar {
      background: #2a2a3c;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    .dark-section .ghost-btn {
      border-color: #3f3f54;
      color: #9ca3af;
    }
    .dark-section .ghost-btn:hover {
      border-color: #60a5fa;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.12);
    }
    .dark-section .workbench-toggle-btn {
      background: #6366f1;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    }
    .dark-section .workbench-toggle-btn:hover {
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.45);
    }
    .dark-section .label { color: #d1d5db; }

    .note {
      font-size: 12px;
      opacity: 0.65;
      max-width: 420px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div>
    <h1>工作台按钮优化效果</h1>
    <p>实心品牌色 + 白色图标 + 投影 + 悬停上浮，与 ghost 按钮拉开差距</p>
  </div>

  <div class="header-bar">
    <button class="ghost-btn" aria-label="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="ghost-btn" aria-label="切换主题">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="workbench-toggle-btn" aria-label="切换到工作台模式">
      <span class="workbench-test-badge">TEST</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <div class="user-avatar">D</div>
    <span class="label">dev-local</span>
  </div>

  <div class="note">
    左侧两个为 ghost 图标按钮（设置、主题），中间紫色实心按钮为优化后的「工作台」入口（工作台主题色 #4f46e5），右上角橙色胶囊为 TEST 流光角标。
  </div>

  <div class="dark-section">
    <p style="margin: 0 0 16px; font-size: 13px; opacity: 0.75;">Dark 模式效果</p>
    <div class="header-bar">
      <button class="ghost-btn" aria-label="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="ghost-btn" aria-label="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="workbench-toggle-btn" aria-label="切换到工作台模式">
        <span class="workbench-test-badge">TEST</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <div class="user-avatar">D</div>
      <span class="label">dev-local</span>
    </div>
  </div>

</body>
</html>
