<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <title>感智晓界用户统计报表</title>
  <style type="text/css">
    :root {
        --bg-page: #F0F2F5;
        --bg-card: #FFFFFF;
        --bg-thead: #FAFAFA;
        --text-primary: #1A1A2E;
        --text-secondary: #8C8C8C;
        --text-table: #333333;
        --color-danger: #E74C3C;
        --border-row: #F0F0F0;
        --radius-card: 8px;
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    body {
        background-color: var(--bg-page);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-primary);
        padding: 32px 16px 48px;
        margin: 0 auto;
        max-width: 1200px;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }

    p.p3 {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0 0 16px 0;
        padding-left: 14px;
        position: relative;
    }
    p.p3::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 18px;
        border-radius: 2px;
        background: var(--color-danger);
    }

    table.t1 {
        border-collapse: collapse;
        width: 100%;
        background: var(--bg-card);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        margin-bottom: 24px;
    }

    td.td1, td.td2 {
        background-color: var(--bg-thead);
        color: var(--text-table);
        font-weight: 600;
        font-size: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-row);
        text-align: left;
    }

    td.td4, td.td5 {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-row);
        font-size: 14px;
        color: var(--text-table);
        text-align: left;
        font-variant-numeric: tabular-nums;
    }

    td.td10, td.td11 {
        background-color: var(--bg-thead);
        font-weight: 700;
        padding: 12px 16px;
        font-size: 14px;
        color: var(--text-primary);
        text-align: left;
        font-variant-numeric: tabular-nums;
    }

    p.p1, p.p4, p.p5, p.p6 {
        margin: 0;
        font-size: 14px;
        font-weight: 400;
        color: var(--text-table);
    }
    p.p1 { font-weight: 700; color: var(--text-primary); }
    p.p4 { font-weight: 600; color: var(--text-table); }

    span.s9 { background: transparent; font-size: 16px; font-weight: 700; }
    span.s10, span.s11 { background: transparent; }

    table.t1 tbody tr:hover td {
        background-color: #F5F7FA;
    }
    table.t1 tbody tr:last-child:hover td.td10,
    table.t1 tbody tr:last-child:hover td.td11 {
        background-color: #ECEEF2;
    }

    @media (max-width: 720px) {
        body { padding: 16px 12px 32px; }
        table.t1 { font-size: 13px; }
        td.td1, td.td2,
        td.td4, td.td5,
        td.td10, td.td11 {
            padding: 10px 12px;
        }
    }

    @media print {
        body { background: #fff; padding: 0; }
        table.t1 { box-shadow: none; border: 1px solid #e5e7eb; }
        table.t1 tbody tr:hover td { background: transparent; }
    }
  </style>
</head>
<body>
