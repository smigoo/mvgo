<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工坊 · 项目级端到端开发工作台（原型）</title>
<style>
:root{
  --blue:#1890ff;--blue-bg:#e6f4ff;--blue-bd:#91caff;--blue-dk:#0958d9;
  --purple:#722ed1;--purple-bg:#f9f0ff;--purple-bd:#d3adf7;--purple-dk:#531dab;
  --green:#52c41a;--green-bg:#f6ffed;--green-bd:#b7eb8f;
  --amber:#faad14;--amber-bg:#fffbe6;--amber-bd:#ffe58f;
  --red:#ff4d4f;--red-bg:#fff2f0;--red-bd:#ffccc7;
  --t1:#1f1f1f;--t2:#595959;--t3:#8c8c8c;--t4:#bfbfbf;
  --bd:#e8e8e8;--bd2:#f2f2f2;--bg:#f0f2f5;--card:#fff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;cursor:pointer;border:none;background:none;color:inherit}
code,.mono{font-family:var(--mono);font-size:12px}
h1,h2,h3,h4{font-weight:500}

.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* 顶栏 */
.top{height:52px;flex:none;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 16px}
.logo{font-weight:500;font-size:14px;letter-spacing:.2px;white-space:nowrap}
.logo span{color:var(--t3);font-weight:400;font-size:12px;margin-left:6px}
.pj{display:flex;align-items:baseline;gap:8px;min-width:0}
.pj-name{font-weight:500;font-size:13px;white-space:nowrap}
.pj-path{font-family:var(--mono);font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:11px;white-space:nowrap}
.chip.warn{background:var(--amber-bg);color:#ad6800;border:1px solid var(--amber-bd)}
.chip.ok{background:var(--green-bg);color:#237804;border:1px solid var(--green-bd)}
.chip.info{background:var(--blue-bg);color:var(--blue-dk);border:1px solid var(--blue-bd)}
.chip.ghost{border:1px solid var(--bd);color:var(--t2)}
.btn{height:30px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--t1);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-dk);border-color:var(--blue-dk);color:#fff}
.btn.pri:disabled{background:var(--t4);border-color:var(--t4);cursor:not-allowed;color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--bd2)}

.body{flex:1;display:flex;min-height:0}

/* 左：阶段导航 */
.rail{width:214px;flex:none;background:var(--card);border-right:1px solid var(--bd);overflow-y:auto;padding:10px 0 20px}
.rail-h{padding:6px 14px 10px;font-size:11px;color:var(--t3);letter-spacing:.4px}
.ri{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 14px;border-left:2px solid transparent;width:100%;text-align:left;transition:.12s}
.ri:hover{background:var(--bd2)}
.ri.on{background:var(--blue-bg);border-left-color:var(--blue)}
.ri-id{font-family:var(--mono);font-size:11px;color:var(--t3);width:20px;flex:none}
.ri.on .ri-id{color:var(--blue-dk)}
.ri-name{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-mark{flex:none;font-size:11px;width:14px;text-align:center}
.ri.done .ri-mark{color:var(--green)}
.ri.lock .ri-name{color:var(--t4)}
.ri.lock .ri-id{color:var(--t4)}
.ri.block .ri-name{color:#cf1322}
.ri.block .ri-id{color:var(--red)}
.ri.block .ri-mark{color:var(--red);font-weight:700}
.ri.block.on{background:var(--red-bg)}
.ri-sep{height:1px;background:var(--bd2);margin:8px 14px}

/* 中：主区 */
.main{flex:1;min-width:0;overflow-y:auto;padding:16px 20px 40px}
.panel{background:var(--card);border-radius:10px;border:1px solid var(--bd);overflow:hidden;max-width:900px}
.ph{padding:16px 20px 14px;border-bottom:1px solid var(--bd2);display:flex;align-items:flex-start;gap:12px}
.ph h2{font-size:15px}
.ph p{font-size:12px;color:var(--t3);margin-top:3px}
.ph-r{margin-left:auto;flex:none}
.pb{padding:16px 20px}
.pf{padding:12px 20px;background:#fafafa;border-top:1px solid var(--bd2);display:flex;align-items:center;gap:8px}
.pf-r{margin-left:auto;display:flex;gap:8px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.tag.done{background:var(--green-bg);color:#237804}
.tag.active{background:var(--blue-bg);color:var(--blue-dk)}
.tag.lock{background:#fafafa;color:var(--t3);border:1px solid var(--bd)}
.tag.warn{background:var(--amber-bg);color:#ad6800}
.tag.err{background:var(--red-bg);color:#cf1322}
.tag.human{background:var(--purple-bg);color:var(--purple-dk)}

.sec{margin-bottom:18px}
.sec:last-child{margin-bottom:0}
.sec-h{font-size:12px;color:var(--t2);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-h .n{font-family:var(--mono);color:var(--t4);font-size:11px}
.hint{font-size:12px;color:var(--t3);line-height:1.65}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;color:var(--t2);background:#fafafa;padding:7px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--bd2);vertical-align:top}
tr:last-child td{border-bottom:none}
td .mono{color:var(--t2)}
.wrap-t{border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.wrap-t table{font-size:12px}

.card{border:1px solid var(--bd);border-radius:8px;padding:12px 14px;background:var(--card)}
.card.human{border-color:var(--purple-bd);background:var(--purple-bg)}
.card.machine{border-color:var(--blue-bd);background:var(--blue-bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv{display:flex;gap:8px;font-size:12px;padding:3px 0}
.kv k{color:var(--t3);flex:none;min-width:78px}
.kv v{color:var(--t1);font-family:var(--mono);font-size:11.5px;word-break:break-all}

.art{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.art .ic{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);flex:none;font-weight:500}
.art.m .ic{background:var(--blue-bg);color:var(--blue-dk)}
.art.h .ic{background:var(--purple-bg);color:var(--purple-dk)}
.art .nm{font-family:var(--mono);font-size:12px}
.art .mt{font-size:11px;color:var(--t3);margin-top:1px}
.art .rt{margin-left:auto;font-size:11px;flex:none}

.opt{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;transition:.12s;margin-bottom:8px;align-items:flex-start}
.opt:hover{border-color:var(--blue-bd);background:var(--blue-bg)}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--t4);flex:none;margin-top:2px;position:relative}
.opt.sel .rd{border-color:var(--blue)}
.opt.sel .rd:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--blue)}
.opt .t{font-size:12.5px;font-weight:500}
.opt .d{font-size:11.5px;color:var(--t3);margin-top:2px;font-family:var(--mono)}

.gen{display:flex;flex-direction:column;gap:1px;background:var(--bd2);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.gi{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--card);font-size:12px}
.gi .st{width:14px;flex:none;text-align:center;font-size:11px}
.gi.pend .st{color:var(--t4)}
.gi.run .st{color:var(--blue)}
.gi.ok .st{color:var(--green)}
.gi .p{font-family:var(--mono);font-size:11.5px;color:var(--t2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .tg{font-size:11px;color:var(--t3);flex:none}

.alert{display:flex;gap:9px;padding:11px 13px;border-radius:8px;font-size:12px;line-height:1.6}
.alert.w{background:var(--amber-bg);border:1px solid var(--amber-bd);color:#874d00}
.alert.i{background:var(--blue-bg);border:1px solid var(--blue-bd);color:var(--blue-dk)}
.alert.e{background:var(--red-bg);border:1px solid var(--red-bd);color:#a8071a}
.alert .ai{flex:none;font-weight:500}

.ptr{display:inline-block;padding:0 5px;border-radius:3px;background:var(--purple-bg);color:var(--purple-dk);font-family:var(--mono);font-size:11px;border:1px solid var(--purple-bd)}
.mono-s{font-family:var(--mono);font-size:11.5px;color:var(--t2);background:#fafafa;padding:1px 5px;border-radius:3px;border:1px solid var(--bd2)}

/* 右：人读文档 */
.docs{width:392px;flex:none;background:var(--card);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.docs-h{height:38px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--bd);gap:6px}
.docs-h span{font-size:11px;color:var(--t3)}
.tabs{display:flex;gap:4px;flex:1}
.tab{height:26px;padding:0 9px;border-radius:5px;font-size:11.5px;color:var(--t2);white-space:nowrap}
.tab:hover{background:var(--bd2)}
.tab.on{background:var(--purple-bg);color:var(--purple-dk)}
.doc-meta{padding:10px 14px;border-bottom:1px solid var(--bd2);background:#fafafa;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--t3)}
.doc-meta b{color:var(--t2);font-weight:400;font-family:var(--mono)}
.doc{flex:1;overflow-y:auto;padding:14px 16px 40px}
.doc h1{font-size:14px;margin-bottom:2px}
.doc h4{font-size:12.5px;margin:16px 0 6px;padding-left:8px;border-left:3px solid var(--purple);display:flex;align-items:center;gap:6px}
.doc h4:first-of-type{margin-top:8px}
.doc p{font-size:12px;color:var(--t2);margin-bottom:6px;line-height:1.7}
.doc ul{margin:0 0 6px 16px;font-size:12px;color:var(--t2);line-height:1.8}
.doc li::marker{color:var(--t4)}
.doc table{font-size:11.5px;margin-bottom:4px}
.doc th{padding:5px 7px;font-size:11px}
.doc td{padding:5px 7px}
.doc .wrap-t{margin-bottom:6px}
.doc-empty{color:var(--t3);font-size:12px;padding:30px 8px;text-align:center;line-height:1.8}
.doc-note{font-size:11.5px;color:var(--purple-dk);background:var(--purple-bg);border:1px solid var(--purple-bd);border-radius:6px;padding:7px 9px;margin-bottom:10px;line-height:1.6}

.stamp{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--green-bg);color:#237804;border:1px solid var(--green-bd)}

.toast{position:fixed;right:20px;bottom:20px;z-index:99;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tst{background:#1f1f1f;color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;max-width:420px;line-height:1.55;animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

.rev{width:100%;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:12px;resize:vertical;min-height:64px;margin-top:8px;outline:none}
.rev:focus{border-color:var(--blue)}

/* ===== 顶部链路条：先做什么、再做什么 ===== */
.flow{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;margin-bottom:12px;max-width:900px}
.flow-h{font-size:11.5px;color:var(--t3);margin-bottom:9px}
.flow-h b{color:var(--t2);font-weight:500}
.flow-h i{font-style:normal;color:var(--purple-dk);background:var(--purple-bg);border:1px solid var(--purple-bd);border-radius:4px;padding:0 5px}
.fch{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.fc{display:flex;flex-direction:column;gap:1px;padding:5px 9px;border:1px solid var(--bd);border-radius:6px;background:#fafafa;cursor:pointer;transition:.15s}
.fc:hover{border-color:var(--blue)}
.fc .a{font-family:var(--mono);font-size:10px;color:var(--t3)}
.fc .b{font-size:11px;color:var(--t1);white-space:nowrap}
.fc.stop{border-color:var(--purple-bd);background:var(--purple-bg)}
.fc.stop .a{color:var(--purple-dk)}
.fc.on{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 0 0 2px var(--blue-bg)}
.arw{color:var(--t4);font-size:11px;flex:none}
.fn{font-size:11px;color:var(--t3);margin-top:9px;line-height:1.9;border-top:1px dashed var(--bd);padding-top:8px}
.fn b{color:var(--t2);font-weight:500}

/* ===== 阶段带：吃到什么 → 做什么 → 吐出什么 ===== */
.strip{display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr;align-items:stretch;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:8px;max-width:900px}
.strip .sc{padding:9px 11px;background:#fafafa;min-width:0}
.strip .sc b{display:block;font-size:10.5px;color:var(--t3);font-weight:400;letter-spacing:.3px;margin-bottom:3px}
.strip .sc span{font-size:11.5px;color:var(--t1);line-height:1.55}
.strip .ar{display:flex;align-items:center;justify-content:center;color:var(--t4);background:var(--card);font-size:10px}
.fm{font-family:var(--mono);font-size:10.5px;color:var(--blue-dk);background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:3px;padding:0 4px;display:inline-block}
.htag{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:7px 11px;border-radius:10px;margin-bottom:14px;max-width:900px}
.htag b{font-weight:500;flex:none}
.htag.yes{background:var(--purple-bg);border:1px solid var(--purple-bd);color:var(--purple-dk)}
.htag.no{background:#fafafa;border:1px solid var(--bd);color:var(--t3)}

/* ===== S0 投喂区 ===== */
.feed{border:1px solid var(--bd);border-radius:8px;padding:12px 13px;margin-bottom:10px;background:var(--card)}
.feed-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;margin-bottom:3px}
.feed-h .step{width:18px;height:18px;border-radius:50%;background:var(--blue-bg);color:var(--blue-dk);font-family:var(--mono);font-size:10.5px;display:flex;align-items:center;justify-content:center;flex:none}
.feed-d{font-size:11.5px;color:var(--t3);margin:0 0 10px 25px;line-height:1.6}
.frow{display:flex;align-items:center;gap:7px;margin:0 0 8px 25px;flex-wrap:wrap}
.frow:last-child{margin-bottom:0}
.fld{display:flex;align-items:center;gap:5px;font-size:12px;flex:none}
.fld k{color:var(--t3);font-size:11.5px;font-weight:400}
.inp{height:28px;border:1px solid var(--bd);border-radius:6px;padding:0 9px;font-family:var(--mono);font-size:11.5px;color:var(--t1);background:var(--card);outline:none;min-width:0;flex:1}
.inp:focus{border-color:var(--blue)}
.inp.w2{flex:none;width:110px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;flex:none}
.seg button{height:28px;padding:0 12px;font-size:11.5px;color:var(--t2);background:var(--card)}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--blue);color:#fff}
.lnk{display:flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--bd2);border-radius:6px;background:#fafafa;font-family:var(--mono);font-size:11px;color:var(--t2);margin-bottom:5px}
.lnk .x{color:var(--t4);font-size:12px;flex:none;padding:0 2px}
.lnk .x:hover{color:var(--red)}
.drop{border:1px dashed var(--bd);border-radius:8px;padding:13px;text-align:center;color:var(--t3);font-size:11.5px;background:#fafafa;cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--blue);color:var(--blue-dk);background:var(--blue-bg)}
.ri.human .ri-id{color:var(--purple-dk)}
.ri.human{background:linear-gradient(90deg,var(--purple-bg),transparent 60%)}
.ri.human.on{background:linear-gradient(90deg,var(--purple-bg),var(--blue-bg))}

@media (max-width:1240px){.docs{width:340px}}
@media (max-width:1080px){
  .body{flex-direction:column}
  .rail{width:100%;display:flex;gap:2px;overflow-x:auto;padding:6px;border-right:none;border-bottom:1px solid var(--bd)}
  .ri{width:auto;flex:none;border-left:none;border-bottom:2px solid transparent;padding:6px 10px}
  .ri.on{border-left:none;border-bottom-color:var(--blue)}
  .rail-h,.ri-sep{display:none}
  .main{flex:1}
  .docs{width:100%;max-height:44vh;border-left:none;border-top:1px solid var(--bd)}
}
</style>

    +'<div class="sec" style="margin-top:16px"><div class="sec-h"><span class="n">4</span>识别结果 · <span class="mono-s">.gen/spec/project.manifest.json</span></div>'+tb
    +'<div class="hint" style="margin-top:8px">识别不靠目录名：本例 <span class="mono-s">03-microvideo-framework3.x-lite-example-master</span> 名字毫无规律，只能靠特征（pom.xml 里出现 spring-boot）判定。识别结果可手工纠正（声明优先于特征）。</div></div>'
    +'<div class="sec"><div class="sec-h"><span class="n">5</span>缺失清单</div>'+miss+'</div>'
    +'<div class="sec"><div class="sec-h"><span class="n">6</span>本次是真实扫描，不是演示动画</div>'
    +'<div class="code" style="margin-top:6px">node s0-scan.cjs '+SCAN.root+' --out …/2026-11-04-s0-scan</div>'
    +'<div class="hint" style="margin-top:8px">扫描器只用 Node 内置模块（docx 用 zlib 自解 ZIP，不依赖系统 unzip）；<b>全程只读输入目录，产物写到 --out</b>。'+roSentence()+'</div></div>'
    +'</div>'
    +foot('<span class="hint">S0 只读不改：到这一步你的原目录一个字节都没动</span>',
      '<button class="btn pri" data-act="go" data-id="S1">下一步：S1 多源对齐</button>')
  );
}

function viewS1(){
  var confTag={high:'<span class="tag done">高</span>',declared:'<span class="tag done">文档</span>',
    partial:'<span class="tag warn">部分</span>',candidate:'<span class="tag warn">候选</span>'};
  var srcTag=function(s){return '<span class="tag '+(s==='prototype'?'info':(s==='frontend'?'warn':'err'))+'">'+s+'</span>'};
  var tb='<div class="wrap-t"><table><thead><tr><th>路径</th><th>方法</th><th>来源</th><th>置信度</th><th>标记</th><th>功能名</th></tr></thead><tbody>';
  EP.forEach(function(e){
    tb+='<tr><td><code>'+e.p+'</code></td><td class="mono-s">'+e.v+'</td><td>'
      +e.src.map(srcTag).join(' ')+'</td><td>'+(confTag[e.conf]||e.conf)+'</td><td class="mono-s" style="font-size:11px">'
      +e.flags.join('<br>')+'</td><td class="hint">S2 由 LLM 回填</td></tr>';
  });
  tb+='</tbody></table></div>';
  var nProto=EP.filter(function(e){return e.src.indexOf('prototype')>=0}).length;
  var nFe=EP.filter(function(e){return e.src.length===1&&e.src[0]==='frontend'}).length;
  var nBe=EP.filter(function(e){return e.src.length===1&&e.src[0]==='backend'}).length;
  var nHigh=EP.filter(function(e){return e.conf==='high'}).length;

  var conf='<div class="wrap-t"><table><thead><tr><th>#</th><th>冲突</th><th>实测证据</th><th>处理</th></tr></thead><tbody>'
    +'<tr><td>CF-DOC-ZERO-ENDPOINT</td><td><b>需求文档 0 个接口路径</b></td><td class="mono-s">正文 '+SCAN.doc.lines+' 行，命中 '+SCAN.doc.hits+'</td><td><span class="tag err">抛给你选 A/B/C</span></td></tr>'
    +'<tr><td>CF-PROJECTJSON-MISSING</td><td>声明层为空</td><td class="mono-s">项目根无 mvgo.project.json</td><td><span class="tag warn">抛给你定</span></td></tr>'
    +'<tr><td>CF-FRONTEND-ORPHAN</td><td>前端 api 封装里 '+nFe+' 个端点无其他来源印证</td><td class="mono-s">'+feOrphanEv()+'</td><td><span class="tag warn">确认是否模板示例</span></td></tr>'
    +'<tr><td>CF-PREFIX-INCONSISTENT</td><td>前缀三源不一致</td><td class="mono-s">原型 '+(SCAN.prefixes.declared||'—')+' ↔ 前端 '+(SCAN.prefixes.fe||'—')+' ↔ 后端 '+(SCAN.prefixes.be||'—')+'</td><td><span class="tag warn">抛给你定网关</span></td></tr>'
    +'</tbody></table></div>';

  return panel(
    head('S1 · 多源对齐','四源抽取 + 三方对齐 —— 端点是三来源，不是一来源','<span class="tag err">1 处 blocker</span>'),
    '<div class="pb">'
    +'<div class="alert e" style="margin-bottom:14px"><span class="ai">实测卡点</span><span><b>需求文档 '+SCAN.doc.lines+' 行正文里 0 个接口路径</b> —— 端点的「主源」是空的。'+SCAN.proto.unique+' 个唯一点端点全部只有原型一个来源（标记 <span class="mono-s">prototypeOnly-未交叉验证</span>），置信度最高只到 <span class="mono-s">candidate</span>，<b>不许因为「它在原型里出现过」就当真值</b>。</span></div>'
    +'<div class="sec"><div class="sec-h"><span class="n">1</span>抽源统计（判据看「去重后」列，不看命中次数）</div>'
    +'<div class="wrap-t"><table><thead><tr><th>源</th><th>扫了</th><th>命中</th><th>去重后唯一点</th></tr></thead><tbody>'
    +'<tr><td>① 需求文档</td><td class="mono-s">1 文件 / '+SCAN.doc.lines+' 行</td><td class="mono-s">'+SCAN.doc.hits+'</td><td><span class="tag err">0 · 主源为空</span></td></tr>'
    +'<tr><td>② 原型 JS/HTML</td><td class="mono-s">'+SCAN.proto.pages+' 页 / '+SCAN.proto.scripts+' 脚本（库 '+SCAN.proto.libs+'）</td><td class="mono-s">'+SCAN.proto.hits+'</td><td>'+SCAN.proto.unique+'</td></tr>'
    +'<tr><td>③ 前端 api 封装</td><td class="mono-s">'+SCAN.fe.files+' 文件</td><td class="mono-s">'+SCAN.fe.hits+'</td><td>1</td></tr>'
    +'<tr><td>④ 后端 controller</td><td class="mono-s">'+SCAN.be.files+' 文件</td><td class="mono-s">'+SCAN.be.hits+'</td><td>2</td></tr>'
    +'</tbody></table></div>'
    +'<div class="hint" style="margin-top:8px">⚠️ 命中次数 ≠ 唯一点端点：同一路径在 <span class="mono-s">service.js</span> 与 <span class="mono-s">service-overview.js</span> 各出现一次 ⇒ '+SCAN.proto.unique+' × 2 = '+SCAN.proto.hits+'。只看命中数会把「复制粘贴」当「两个来源」。</div></div>'
    +'<div class="sec"><div class="sec-h"><span class="n">2</span>端点对齐（'+EP.length+' 个）</div>'+tb+'</div>'
    +'<div class="sec"><div class="sec-h"><span class="n">3</span>孤儿检查</div><div class="grid3">'
    +'<div class="card"><div style="font-size:20px;font-weight:500;color:var(--amber)">'+nProto+'</div><div class="hint">仅原型来源（未交叉验证）</div></div>'
    +'<div class="card"><div style="font-size:20px;font-weight:500;color:var(--amber)">'+nFe+'</div><div class="hint">仅前端来源（疑似模板示例）</div></div>'
    +'<div class="card"><div style="font-size:20px;font-weight:500;color:var(--amber)">'+nBe+'</div><div class="hint">仅后端来源（基座自带）</div></div>'
    +'</div><div class="hint" style="margin-top:8px">交叉验证命中的端点（≥2 源）：<b>'+nHigh+'</b> 个 ⇒ 没有一条端点是「文档 + 代码」双证的。</div></div>'
    +'<div class="sec"><div class="sec-h"><span class="n">4</span>冲突检测 · 实测 '+SCAN.conflicts+' 条</div>'+conf
    +'<div class="hint" style="margin-top:8px">冲突<b>不猜</b>：一律抛给用户选，选择结果写回 <span class="mono-s">spec/conflicts.md</span> 作为已拍板变更项。扫描器连「疑似模板示例」都不删，只加标记。</div></div>'
    +'</div>'
    +foot('<span class="hint">闸门：交叉验证命中 ≥1 才可冻结；当前 0 ⇒ 必须在 S2 先裁决</span>',
      '<button class="btn" data-act="go" data-id="S2">下一步：S2 契约冻结 · 带 1 处 blocker</button>')
  );
}

/* =====================================================================
 * 冻结判据（单一来源，视图与事件处理共用）
 * 「选了选项」≠「消解了 blocker」：只有 A 当场产出端点集合；B/C 是路径，要先执行完才算数。
 * 视图用它决定按钮是否 disabled，处理器用同一函数把关 —— 两处判据必须同源，否则
 * 按钮灰了但处理器仍放行，就是「假闸门」。
 * ===================================================================== */
function blockerResolved(){ return state.gap==='A' }
function canFreezeContract(){ return blockerResolved()&&!!state.env }

function viewS2(){
  var sel=function(k){return state.env===k?' sel':''};
  var endpointsReady=blockerResolved();
  var envName=state.env==='fw'?'框架口径 {code,message,detail,data}':(state.env==='mt'?'素材口径 {code,message,data}':'未裁决');

  /* ---- 区块 0：前置 blocker（实测产物 conflicts.md 的第一条） ---- */
  var gapBox='<div class="sec"><div class="sec-h"><span class="n">0</span>先解 blocker · <span class="mono-s">'+GAP+'</span>'
    +(endpointsReady?' <span class="tag done">已消解 · 选 A</span>'
      :(state.gap?' <span class="tag err">已选 '+state.gap+' 但未消解</span>':' <span class="tag err">未消解</span>'))+'</div>'
    +'<div class="alert e" style="margin-bottom:10px"><span class="ai">BLOCK</span><span>'
    +'需求文档正文 <b>'+SCAN.doc.lines.toLocaleString('en-US')+' 行</b>，<b>'+SCAN.doc.hits+' 处</b>出现 <span class="mono-s">/api</span> '
    +'⇒ 文档侧端点集合 = <b>∅</b>。第五处对账要的是「两边都非空且相等」，空集<b>判不出来</b>——'
    +'这不是「没查到」，是<b>主源缺失</b>。所以它被登记成 blocker 而不是 warning。</span></div>'
    +'<div>'+GAP_OPTS.map(function(o){
        return '<div class="opt'+(state.gap===o.id?' sel':'')+'" data-act="gap" data-v="'+o.id+'">'
          +'<div class="rd"></div><div><div class="t">'+o.id+' · '+o.t+'</div>'
          +'<div class="d" style="font-family:inherit">'+o.d+'</div>'
          +'<div class="d" style="font-family:inherit;color:var(--amber)">代价：'+o.risk+'</div></div></div>';
      }).join('')+'</div>'
    +(state.gap&&!endpointsReady
      ? '<div class="alert w" style="margin-top:2px"><span class="ai">还没完</span><span>选 '+state.gap+' 只是<b>定了一条路径</b>，不是消解。执行完它之前，端点集合仍是空的，冻结按钮保持禁用。</span></div>'
      : '<div class="hint" style="margin-top:6px">裁决写回 <span class="mono-s">spec/conflicts.md</span> 作为已拍板变更项。<b>扫描器不替你选</b>——三个选项代价不同，是取舍不是对错。</div>')
    +'</div>';

  /* ---- 区块 1：响应信封。三级来源：声明 > 探测 > A7 默认；只有「声明」是真值 ---- */
  var envKnown=!!(SCAN.envelope&&SCAN.envelope.confirmed);
  var envEvidence=envKnown?'mvgo.project.json 的 responseEnvelope':(SCAN.envelope&&SCAN.envelope.file?SCAN.envelope.file:'(无来源)');
  var envBanner='<div class="alert '+(envKnown?'':'w')+'" style="margin-bottom:8px"><span class="ai">'
    +(envKnown?'已证实':'待追认')+'</span><span>扫描器判定信封口径＝<b>'
    +(SCAN.envelope?SCAN.envelope.source:'(无)')+'</b>'
    +(SCAN.envelope?' · 字段 <span class="mono-s">'+(SCAN.envelope.keys||[]).join(' / ')+'</span> · successCode <span class="mono-s">'+(SCAN.envelope.successCode===null?'未定':SCAN.envelope.successCode)+'</span>':'')
    +(envKnown?'。取自声明，可直接冻结。'
      :'。探测值是<b>启发式候选</b>（关键词共现，可能把 <span class="mono-s">detail</span> 这类子字段误当顶层字段），<b>追认前不得写进契约真值</b>。要免掉这一步，就把它写进 <span class="mono-s">mvgo.project.json</span> 的 <span class="mono-s">responseEnvelope</span>。')
    +'</span></div>';
  var opts=envBanner+'<div class="opt'+sel('fw')+'" data-act="env" data-v="fw">'
    +'<div class="rd"></div><div><div class="t">框架口径（后端基座 readme.md）<span class="tag '+(envKnown?'done':'')+'" style="margin-left:6px">'+(envKnown?'已声明 · 真值':'探测命中 · 待追认')+'</span></div>'
    +'<div class="d">'+(SCAN.envelope&&SCAN.envelope.keys&&SCAN.envelope.keys.length?'{ '+(SCAN.envelope.keys).join(', ')+' }':'{ code, message, detail, data }')+' · code 参考 HttpStatus（200/400/500…）</div>'
    +'<div class="d" style="font-family:inherit;color:var(--t3)">证据：<span class="mono-s">'+envEvidence+'</span></div></div></div>'
    +'<div class="opt'+sel('mt')+'" data-act="env" data-v="mt">'
    +'<div class="rd"></div><div><div class="t">素材口径（上游测试素材已拍板）</div>'
    +'<div class="d">{ code, message, data } · 无 detail，统一 code:200</div>'
    +'<div class="d" style="font-family:inherit;color:var(--t3)">证据：上游口头拍板，样本目录内<b>无落到文件</b></div></div></div>';

  /* ---- 区块 2：同一次收敛，两个面 ---- */
  var arts='<div class="grid2">'
    +'<div class="art m"><div class="ic">YML</div><div><div class="nm">openapi.local.yaml</div><div class="mt">'
      +(endpointsReady?'机器真值 · '+SCAN.proto.unique+' paths · 端点主源＝A（原型候选升格）'
               :'<span style="color:var(--amber)">端点集合未定 · 等 '+GAP+' 消解</span>')+'</div></div></div>'
    +'<div class="art h"><div class="ic">MD</div><div><div class="nm">REQUIREMENTS.md</div><div class="mt">'
      +(endpointsReady?'人读唯一源 · 与契约同一拍产出'
               :'<span style="color:var(--amber)">未产出 · 无端点可写</span>')+'</div></div></div>'
    +'</div>'
    +'<div class="hint" style="margin-top:8px">给机器看的 <span class="mono-s">openapi.local.yaml</span>，给人看的 <span class="mono-s">REQUIREMENTS.md</span> —— 同一份真值的两个视图，不是两份真值。字段级真值只写在契约里，文档只写 JSON Pointer 引用。</div>';

  /* ---- 区块 3：第五处对账。判不出来时不许写「通过」 ---- */
  var recRows;
  if(endpointsReady){
    recRows=[
      ['REQUIREMENTS.md 端点 → OAS paths','9/9 命中，<b>无多出</b> <span class="tag done">通过</span>'],
      ['OAS paths → REQUIREMENTS.md 条目','9/9 命中，<b>无多出</b> <span class="tag done">通过</span>'],
      ['文档内 JSON Pointer 可解析','契约与文档尚未落盘 ⇒ 退回 S2 复核 <span class="tag warn">待落盘</span>']
    ];
  }else if(state.gap==='B'){
    recRows=[
      ['REQUIREMENTS.md 端点 → OAS paths','需先补文档并<b>重跑 S1</b> <span class="tag lock">待执行</span>'],
      ['OAS paths → REQUIREMENTS.md 条目','同上 <span class="tag lock">待执行</span>'],
      ['文档内 JSON Pointer 可解析','同上 <span class="tag lock">待执行</span>']
    ];
  }else if(state.gap==='C'){
    recRows=[
      ['REQUIREMENTS.md 端点 → OAS paths','需先把 <b>S7 Apifox 反接</b>提前跑一次 <span class="tag lock">待执行</span>'],
      ['OAS paths → REQUIREMENTS.md 条目','同上，且来源须在 conflicts.md 记明 <span class="tag lock">待执行</span>'],
      ['文档内 JSON Pointer 可解析','同上 <span class="tag lock">待执行</span>']
    ];
  }else{
    recRows=[
      ['REQUIREMENTS.md 端点 → OAS paths','文档侧集合 = ∅ ⇒ 差集无定义 <span class="tag warn">无法判定</span>'],
      ['OAS paths → REQUIREMENTS.md 条目','契约未生成 ⇒ 右集合不存在 <span class="tag warn">无法判定</span>'],
      ['文档内 JSON Pointer 可解析','无文档 ⇒ 无 Pointer <span class="tag warn">无法判定</span>']
    ];
  }
  var rec='<div class="wrap-t"><table><thead><tr><th>第五处对账（人读 ↔ 机器）</th><th>结果</th></tr></thead><tbody>'
    +recRows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')
    +'</tbody></table></div>'
    +'<div class="hint" style="margin-top:8px">'
    +(endpointsReady
      ? '必须在<b>这一拍</b>做，不能推到 S6 —— S2 之后一律只从契约派生，晚了要回滚重冻契约。'
      : '⚠️ 上表<b>没有一行是绿的</b>，因为这一拍还跑不了：先解区块 0。把这个「判不出来」直接写成「通过」，就是把 blocker 抹平。')
    +'</div>';

  /* ---- 冻结按钮：端点集合 + 信封，两个前提缺一不可（判据同上，单一来源） ---- */
  var canFreeze=canFreezeContract();
  var btn=state.frozen
    ? '<button class="btn" disabled>契约已冻结</button>'
    : '<button class="btn pri" data-act="freeze" '+(canFreeze?'':'disabled')+'>冻结契约</button>';

  var footHint=state.frozen
    ? '<span class="hint">已冻结 · 信封 '+envName+'</span>'
    : (!endpointsReady
        ? '<span class="hint">'+GAP+' 未消解 → 冻结按钮禁用（先裁决并执行区块 0）</span>'
        : (!state.env
            ? '<span class="hint">未选信封 → 冻结按钮禁用</span>'
            : '<span class="hint">两个前提已满足：端点主源＝A｜信封＝'+envName+'</span>'));

  return panel(
    head('S2 · 契约冻结','唯一收敛点：S2 之前全是理解，S2 之后全是生产 —— 生产阶段不许自己发明字段',
      state.frozen?'<span class="tag done">已冻结</span>'
        :(endpointsReady?'<span class="tag active">可冻结</span>':'<span class="tag err">BLOCK</span>')),
    '<div class="pb">'
    +gapBox
    +'<div class="sec"><div class="sec-h"><span class="n">1</span>响应信封 · 二选一（有一边带实测依据）</div>'+opts
    +'<div class="hint" style="margin-top:6px">原始冲突 <span class="mono-s">CF-PREFIX-INCONSISTENT</span> 同时暴露了「口径打架」这件事。<b>未裁决不许进正文</b>，这就是「冲突不猜」。</div></div>'
    +'<div class="sec"><div class="sec-h"><span class="n">2</span>同一次收敛，两个面</div>'+arts+'</div>'
    +'<div class="sec"><div class="sec-h"><span class="n">3</span>第五处对账</div>'+rec+'</div>'
    +'</div>'
    +foot(footHint, btn)
  );
}

/* 冻结后契约的 paths 数：主源＝选 A 时的原型去重端点。孤儿端点（仅前端 / 仅后端）按「不纳入」处理
 * —— S1 已给它们打上「疑似模板示例 / 基座自带」标记，纳入与否要在 S2 显式裁决，这里按未纳入算。 */
function frozenPaths(){ return SCAN.proto.unique; }
/* 扫描器检查的坑位总数：这是**结构常量**（docs/html/frontend/backend/projJson/.git），
   不是扫描结果，所以写在这里；「命中几个」由 SCAN.slots.missing 现算。 */
var SLOT_TOTAL=6;
/* 孤儿端点分项计数：都从 EP 现算，不手抄「仅前端 1 + 仅后端 2」 */
function orphFe(){ return EP.filter(function(e){return e.conf==='candidate'&&e.src.length===1&&e.src[0]!=='prototype'}).length; }
function orphBe(){ return EP.filter(function(e){return e.conf==='partial'}).length; }
function orphanCount(){ return orphFe()+orphBe(); }
/* 证据单元格（文件:行 → 端点首段）：两个都来自扫描产物 fullEvidence.frontend，不手抄 */
function feOrphanEv(){
  if(!SCAN.feEv||!SCAN.feEv.length) return '—';
  return SCAN.feEv.map(function(e){
    var f=String(e.f).replace(/^.*?\/(?=src\/)/,'');
    var seg='/'+String(e.p).split('/').filter(Boolean)[0];
    return f+':'+e.l+' → '+seg+'/…';
  }).join('；');
}
/* 「样本目录共 N 个文件 … 0 个被改」—— 由扫描器前后两次快照比对得出（S0.footprint / S0.readOnly），
   不是手写数字。取不到就明说取不到，绝不留一个看起来对的数字。 */
function roSentence(){
  var f=SCAN.footprint, r=SCAN.readOnly;
  if(!f) return '（本次产物未记录目录足迹 —— 旧版扫描器产物，请重跑 <span class="mono-s">s0-scan.cjs</span>）';
  var gitPath=(SCAN.git&&SCAN.git.path)?'<span class="mono-s">'+SCAN.git.path+'/.git</span>':'<span class="mono-s">.git</span>';
  var s='本次<b>扫描前后各拍一次目录快照</b>再比对：样本目录共 <b>'+f.all+'</b> 个文件 = 工作文件 <b>'+f.work
    +'</b> + '+gitPath+' 内 <b>'+f.git+'</b> + <span class="mono-s">.DS_Store</span> <b>'+f.dsStore+'</b>，';
  if(!r) return s+'（未记录比对结果）';
  if(r.changed===0) return s+'<b>0 个被新建/删除/修改</b>（新增 '+r.added+'、删除 '+r.removed+'、改动 '+r.modified+'）。';
  return s+'<b>⚠️ 检出 '+r.changed+' 处变化</b>（新增 '+r.added+'、删除 '+r.removed+'、改动 '+r.modified
    +'）—— 只读承诺被破坏，需立即排查。';
}

function genList(files,n){
  var h='<div class="gen">';
  files.forEach(function(f,i){
    var cls=i<n-1?'ok':(i===n-1?'run':'pend');
    var st=cls==='ok'?'✓':(cls==='run'?'◐':'○');
    var tg=cls==='ok'?'已写入':(cls==='run'?'生成中':'等待');
    h+='<div class="gi '+cls+'"><span class="st">'+st+'</span><span class="p">'+f+'</span><span class="tg">'+tg+'</span></div>';
  });

  h+='<p>对沿江高速的云资源、本地资源、数据安全与服务调用进行统一监控。输入 1 篇需求规格说明书 V1.1.0（264,560 字符）+ 5 个原型页，覆盖 4 个业务模块。</p>';

  h+='<h4>2 功能点清单</h4>';
  h+='<div class="wrap-t"><table><thead><tr><th>#</th><th>功能点</th><th>锚点</th></tr></thead><tbody>'
    +'<tr><td>F1</td><td>服务概览</td><td>三锚点齐</td></tr>'
    +'<tr><td>F2</td><td>云资源监测</td><td>三锚点齐</td></tr>'
    +'<tr><td>F3</td><td>本地资源监测</td><td>三锚点齐</td></tr>'
    +'<tr><td>F4</td><td>数据安全审计</td><td>三锚点齐</td></tr>'
    +'</tbody></table></div>';
  h+='<p>每个功能点必挂三锚点：<b>文档段号 / 画板 nodeId / 端点</b>。无锚点功能点 = 0（否则拒）。</p>';

  h+='<h4>3 端点总表</h4>';
  var t='<div class="wrap-t"><table><thead><tr><th>端点</th><th>字段定义</th></tr></thead><tbody>';
  EP.forEach(function(e){
    t+='<tr><td><code style="font-size:10.5px">'+e.p.replace('/api/','')+'</code></td><td><span class="ptr">'+e.f+'</span></td></tr>';

    +'<li>安全事件 <span class="ptr">#/components/schemas/SecurityEvent</span></li></ul>';

  h+='<h4>5 外部系统与定时任务</h4>';
  h+='<ul><li>外部：省界门架数据接口（推送）</li><li>定时：xxl-job 已有基座，本期不加任务</li></ul>';

  h+='<h4>6 已裁决冲突</h4>';
  var gapTxt=!state.gap?'<span style="color:var(--red)">BLOCKER 未消解</span>'
    :(state.gap==='A'?'A · 原型候选升格为端点主源（'+SCAN.proto.unique+' 个去重端点）'
    :(state.gap==='B'?'B · 补文档后重跑 S1 <span style="color:var(--amber)">（待执行，blocker 仍在）</span>'
    :'C · 提前跑 S7 Apifox 反接 <span style="color:var(--amber)">（待执行，与「本地 OAS 为真值」次序冲突）</span>'));
  h+='<div class="wrap-t"><table><thead><tr><th>#</th><th>冲突</th><th>裁决</th></tr></thead><tbody>'
    +'<tr><td>C0</td><td><span class="mono-s">'+GAP+'</span><br><span style="color:var(--t3)">需求文档 0 处 /api ⇒ 端点主源缺失</span></td><td>'+gapTxt+'</td></tr>'
    +'<tr><td>C1</td><td>响应信封（<span class="mono-s">CF-PREFIX-INCONSISTENT</span>）</td><td>'+(state.env==='fw'?'框架口径':(state.env==='mt'?'素材口径':'<span style="color:var(--amber)">待你在 S2 选</span>'))+'</td></tr>'
    +'<tr><td>C2</td><td>分页字段</td><td>page / size</td></tr>'
    +'<tr><td>C3</td><td>缺失模块</td><td>纳入，自补接口</td></tr>'

    +'</tbody></table></div>';

  h+='<h4>7 sourceHashes</h4>';
  var pending=(!state.gap?1:0)+(!state.env?1:0);
  h+='<p><span class="mono-s">沿江…V1.1.docx md5 91b0…1bf5 · '+SCAN.doc.lines.toLocaleString('en-US')+' 行</span> · <span class="mono-s">原型 5 文件 5 脚本 2 库</span> · 未裁决项 <b'+(pending?' style="color:var(--red)"':'')+'>'+pending+'</b></p>';
  h+='<p class="doc-note">扫描器与本文档都不改样本目录：复现命令 <span class="mono-s">node outputs/s0-scan.cjs /Users/smigoo/工作/test</span>，退出码 1 = 存在 blocker。</p>';
  return h;
}

function renderTabs(){
  var t=[['req','需求唯一源'],['fe','前端设计'],['be','后端设计']];
  document.getElementById('tabs').innerHTML=t.map(function(x){
    return '<button class="tab'+(state.tab===x[0]?' on':'')+'" data-act="tab" data-v="'+x[0]+'">'+x[1]+'</button>';
  }).join('');
}
function renderDocs(){
  renderTabs();
  var m=DOC_META[state.tab];
  document.getElementById('docMeta').innerHTML=m.map(function(x,i){
    return i===0?'<b style="color:var(--t1)">'+x+'</b>':'<span>'+x+'</span>';
  }).join('');
  var body;
  if(state.tab==='req') body=docReq();
  else if(state.tab==='fe') body=state.fe.confirmed?docFe():docFe();
  else body=docBe();
  var stamp='';
  if(state.tab==='fe'&&state.fe.confirmed) stamp='<div style="margin-bottom:10px"><span class="stamp">✓ 人已确认 · 端点集合已锁定</span></div>';
  if(state.tab==='be'&&state.be.confirmed) stamp='<div style="margin-bottom:10px"><span class="stamp">✓ 人已确认 · 表结构已锁定</span></div>';
  document.getElementById('doc').innerHTML=stamp+body;
}
function renderStage(){
  var v;
  if(state.cur==='S0') v=viewS0();
  else if(state.cur==='S1') v=viewS1();
  else if(state.cur==='S2') v=viewS2();
  else if(state.cur==='S3') v=viewS3();
  else if(state.cur==='S4') v=viewS4();
  else if(state.cur==='S5') v=viewS5();
  else if(state.cur==='S6') v=viewS6();
  else if(state.cur==='S7') v=viewS7();
  else v=viewS8();
  document.getElementById('stage').innerHTML=flowBar()+strip(state.cur)+v;
}
function render(){renderRail();renderStage();renderDocs()}

var timers={};
function startGen(side){
  var files=side==='fe'?FE_FILES:BE_FILES;
  var obj=state[side];
  if(timers[side]) clearInterval(timers[side]);
  obj.gen=Math.max(obj.gen,1);
  render();
  timers[side]=setInterval(function(){
    if(obj.gen<files.length){obj.gen++;render()}
    else{clearInterval(timers[side]);timers[side]=null;render()}
  },420);
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act');
  var v=el.getAttribute('data-v');

  if(act==='go'){
    var tid=el.getAttribute('data-id');
    if(!state.s0.scan&&tid!=='S0'){toast('先在 S0 投喂资料 —— 没有输入就没有后面任何一步');return}
    state.cur=tid; render(); return;
  }
  if(act==='tab'){ state.tab=v; renderDocs(); return }

  /* —— S0 投喂 —— */
  if(act==='s0mode'){ syncS0(); state.s0.mode=v; render(); return }
  if(act==='s0pick'){ syncS0(); state.s0.dir='/Users/smigoo/工作/test'; render(); toast('已选中：/Users/smigoo/工作/test'); return }
  if(act==='s0addfigma'){
    syncS0(); state.s0.figma.push('https://www.figma.com/design/<fileKey>/<画板名>?node-id=0-1');
    render(); toast('加了一条 Figma 链接，把占位换成真实地址'); return;
  }
  if(act==='s0delfigma'){ syncS0(); state.s0.figma.splice(+el.getAttribute('data-i'),1); render(); return }
  if(act==='s0adddoc'){
    syncS0(); state.s0.docs.push('接口清单补充说明.md');
    render(); toast('已加入 1 份补充文档'); return;
  }
  if(act==='s0deldoc'){ syncS0(); state.s0.docs.splice(+el.getAttribute('data-i'),1); render(); return }
  if(act==='s0edit'){ state.s0.scan=false; render(); return }
  if(act==='s0scan'){
    syncS0();
    var s0=state.s0;
    var has= s0.mode==='dir' ? !!s0.dir.trim() : !!s0.git.trim();
    if(!has){toast(s0.mode==='dir'?'填一个目录路径再开始':'填一个仓库地址再开始');return}
    s0.scan=true; state.cur='S0'; render();
    toast('识别完成：'+SLOT_TOTAL+' 个坑位命中 '+(SLOT_TOTAL-SCAN.slots.missing)+' 个，缺 mvgo.project.json —— 不阻塞，但缺口下挂 '+SCAN.pjUndecided+' 个未决项，扫描器不填默认值');
    return;
  }

  if(act==='gap'){
    state.gap=v; render();
    var m={A:'已选 A：原型候选升格为端点主源（'+SCAN.proto.unique+' 个去重端点）',
           B:'已选 B：需补文档后重跑 S1 —— blocker 仍在，S2 保持 BLOCK',
           C:'已选 C：需先把 S7 Apifox 反接提前跑 —— 注意与「本地 OAS 为真值」的次序冲突'};
    toast(m[v]||('已裁决 '+v));
    return;
  }
  if(act==='env'){
    state.env=v; render();
    toast('已选：'+(v==='fw'?'框架口径 {code,message,detail,data}':'素材口径 {code,message,data}'));
    return;
  }
  if(act==='freeze'){
    /* 与按钮 disabled 用同一个判据函数 —— 按钮灰了处理器也必须拦，否则就是假闸门 */
    if(!blockerResolved()){toast('先消解 '+GAP+' —— 选 B/C 只是定了路径，端点集合仍是空的');return}
    if(!state.env){toast('先裁决响应信封 —— 冲突不猜');return}
    state.frozen=true; render();
    toast('契约已冻结。S2 之后只从 OAS 派生，禁止二次读需求文档');
    return;
  }

  if(act==='confirmFe'){
    state.fe.confirmed=true; state.reject=false; render();
    toast('FRONTEND-DESIGN.md 已确认，端点集合锁定');
    startGen('fe'); return;
  }
  if(act==='genFe'){ startGen('fe'); return }
  if(act==='reject'){ state.reject=true; render(); return }
  if(act==='cancelRev'){ state.reject=false; render(); return }
  if(act==='submitRev'){
    var t=document.getElementById('revText');
    var txt=t?t.value.trim():'';
    if(!txt){toast('写点东西再提交 —— 空意见等于没驳回');return}
    state.reject=false; render();
    toast('已退回 4a，修改意见写入 .gen/doc/FRONTEND-DESIGN.review.md（不碰任何代码）');
    return;
  }

  if(act==='confirmBe'){
    state.be.confirmed=true; state.rejectBe=false; render();
    toast('BACKEND-DESIGN.md 已确认，表结构锁定');
    startGen('be'); return;
  }
  if(act==='genBe'){ startGen('be'); return }
  if(act==='rejectBe'){ state.rejectBe=true; render(); return }
  if(act==='cancelRevBe'){ state.rejectBe=false; render(); return }
  if(act==='submitRevBe'){
    var t2=document.getElementById('revBeText');
    var txt2=t2?t2.value.trim():'';
    if(!txt2){toast('写点东西再提交');return}
    state.rejectBe=false; render();
    toast('已退回 5a，修改意见写入 .gen/doc/BACKEND-DESIGN.review.md');
    return;
  }

  if(act==='deliver'){
    toast('分支 go-dev 已创建，'+(FE_FILES.length+BE_FILES.length)+' 个文件逐仓提交完成（原型演示，未执行任何 git 命令）');
    return;
  }
});

document.getElementById('chipWarn').addEventListener('click',function(){state.cur='S0';render()});
document.getElementById('btnReset').addEventListener('click',function(){
  Object.keys(timers).forEach(function(k){if(timers[k])clearInterval(timers[k])});
  timers={};
  state={cur:'S0',env:null,gap:null,frozen:false,tab:'req',
    s0:{mode:'dir',dir:'/Users/smigoo/工作/test',git:'https://git.microvideo.cn/ops/yxjc-monitor.git',branch:'go-dev',
        figma:['https://www.figma.com/design/AbC123/沿江监控-运维子系统?node-id=1-2'],
        apifox:'',docs:['沿江监控运维子系统_需求规格说明书_V1.1.docx'],scan:false},
    fe:{design:false,confirmed:false,gen:0},
    be:{design:false,confirmed:false,gen:0},reject:false,rejectBe:false};
  render();
  toast('已重置到 S0 投喂资料');
});

render();
</script>
