<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大屏布局快速生成 · 交互原型</title>
<style>
:root{
  --bg:#0b1220; --panel:#111c2e; --panel2:#16233a;
  --line:rgba(120,170,220,.16); --line2:rgba(120,170,220,.34);
  --tx:#e6eef8; --tx2:#8fa6c0; --tx3:#5d7793;
  --acc:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx); overflow:hidden;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.app{display:flex;flex-direction:column;height:100%}

/* ---------- 顶栏 ---------- */
.topbar{padding:14px 18px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.prompt-row{display:flex;gap:10px;align-items:center}
#prompt{
  flex:1;height:42px;border-radius:10px;border:1px solid var(--line2);
  background:#0c1727;color:var(--tx);padding:0 14px;font-size:13.5px;outline:none;
  font-family:inherit;
}
#prompt:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
button{font-family:inherit;cursor:pointer;border:none;transition:background .15s,border-color .15s,color .15s}
button.primary{
  height:42px;padding:0 22px;border-radius:999px;background:var(--acc);color:#04222f;
  font-size:13.5px;font-weight:500;white-space:nowrap;
}
button.primary:hover{background:#5cc9fa}
button.ghost{
  height:30px;padding:0 14px;border-radius:999px;background:transparent;color:var(--tx2);
  border:1px solid var(--line2);font-size:12px;
}
button.ghost:hover{border-color:var(--acc);color:var(--acc)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{
  padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel2);color:var(--tx2);font-size:12px;
}
.chip:hover{border-color:var(--line2);color:var(--tx)}

/* ---------- 工作区 ---------- */
.workbench{flex:1;display:flex;min-height:0}
.panel{
  width:326px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 16px 28px;
}
.sec{margin-bottom:22px}
.sec-h{font-size:12px;font-weight:500;color:var(--tx3);letter-spacing:.06em;margin-bottom:10px}
.readout{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;display:flex;flex-direction:column;gap:7px;margin-bottom:10px;
}
.ro-row{display:flex;gap:8px;font-size:12.5px;line-height:1.5}
.ro-k{color:var(--tx3);flex:0 0 62px}
.ro-v{color:var(--tx);flex:1;word-break:break-all}
.ro-v em{font-style:normal;color:var(--acc)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{
  border:1px solid var(--line);border-radius:10px;background:var(--panel2);
  padding:9px 10px;text-align:left;color:var(--tx2);font-size:12.5px;line-height:1.35;
}
.mode:hover{border-color:var(--line2);color:var(--tx)}
.mode.on{border-color:var(--acc);background:rgba(56,189,248,.11);color:var(--tx)}
.mode b{display:block;font-weight:500;font-size:12.5px;margin-bottom:2px}
.mode.on b{color:var(--acc)}
.hint{font-size:11.5px;color:var(--tx3);margin-top:9px;line-height:1.55}
.row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px;color:var(--tx2);cursor:pointer}
.row input{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}

/* ---------- 舞台 ---------- */
.stage-wrap{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:22px;background:
    radial-gradient(circle at 1px 1px, rgba(120,170,220,.09) 1px, transparent 0) 0 0/22px 22px;
}
.stage{
  position:relative;flex:0 0 auto;border:1px solid var(--line2);border-radius:10px;
  overflow:hidden;background:#04080f;container-type:size;
  box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(56,189,248,.07);
}
.screen-host{position:absolute;inset:0}
.rs{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;z-index:20;touch-action:none}
.rs::after{
  content:'';position:absolute;right:3px;bottom:3px;width:9px;height:9px;
  border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);border-radius:0 0 2px 0;opacity:.85;
}
.hud{
  display:flex;gap:14px;align-items:center;font-size:12px;color:var(--tx3);
  font-variant-numeric:tabular-nums;
}
.hud b{font-weight:500;color:var(--tx2)}
.hud .bad{color:var(--bad)}
.hud .ok{color:var(--ok)}

/* ---------- 屏幕渲染 ---------- */
.screen{width:100%;height:100%;display:flex;flex-direction:column;box-sizing:border-box}
.screen.fluid{--gap:clamp(5px,1.05cqw,16px);gap:var(--gap);padding:var(--gap);font-size:clamp(8px,1.28cqw,16px)}
.screen.fixed{--gap:12px;gap:var(--gap);padding:16px;font-size:15px;flex:0 0 auto;transform-origin:center center}

.hf{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  border:1px dashed var(--line2);border-radius:6px;color:var(--tx3);
  background:rgba(56,189,248,.045);font-size:.8em;letter-spacing:.04em;overflow:hidden;white-space:nowrap;
}
.screen.fluid .hf{height:clamp(20px,7.6cqh,62px)}
.screen.fluid .hf-bot{height:clamp(15px,5.2cqh,44px)}
.screen.fixed .hf{height:74px}
.screen.fixed .hf-bot{height:50px}

.body{flex:1 1 auto;display:flex;gap:var(--gap);min-height:0}
.col{display:flex;min-width:0;min-height:0}
.stack{flex:1;display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.zone{
  flex:1 1 0;min-height:0;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9%;overflow:hidden;
  border:1px solid rgba(56,189,248,.3);border-radius:6px;
  background:rgba(56,189,248,.055);color:#9ecbff;
}
.dot{
  flex:0 0 auto;width:clamp(9px,3.9cqw,24px);aspect-ratio:1;border-radius:50%;
  border:1.5px solid rgba(56,189,248,.8);background:rgba(56,189,248,.18);
}
.screen.fixed .dot{width:24px;height:24px}
.zl{
  font-size:.8em;letter-spacing:.03em;max-width:88%;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:13px}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="prompt-row">
      <input id="prompt" type="text" spellcheck="false"
             value="1920×1080 自适应，左边两栏右边两栏">
      <button id="go" class="primary">生成布局</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="workbench">
    <div class="panel">

      <div class="sec">
        <div class="sec-h">我这样理解了</div>
        <div class="readout" id="readout"></div>
        <button id="alt" class="ghost">换一种理解</button>
      </div>

      <div class="sec">
        <div class="sec-h">自适应策略</div>
        <div class="modes" id="modes"></div>
        <div class="hint" id="modeHint"></div>
      </div>

      <div class="sec">
        <div class="sec-h">微调</div>
        <label class="row"><span>头部标题栏</span><input type="checkbox" id="cbH"></label>
        <label class="row"><span>底部状态栏</span><input type="checkbox" id="cbF"></label>
      </div>

    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="screen-host" id="host"><div class="empty">说一句话，生成布局</div></div>
        <div class="rs" id="rs"></div>
      </div>
      <div class="hud" id="hud"></div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var CN = { '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };
  var NUMS = '[一二三四五六七八九十两0-9]{1,3}';
  var MODES = [
    { id: 'fluid',   name: '流式',   sub: 'fr 分配骨架',     hint: '推荐。骨架弹性伸缩，圆形和文字都不变形，多余的宽高由列和间隙吃掉。' },
    { id: 'contain', name: '等比留边', sub: 'contain',        hint: '整块等比缩放。比例不符时上下或左右留黑边，内容绝不变形。' },
    { id: 'cover',   name: '等比裁剪', sub: 'cover',          hint: '整块等比放大到铺满，超出部分被裁掉。适合有满屏背景图的场景。' },
    { id: 'stretch', name: '双轴拉伸', sub: 'stretch',        hint: '横竖各自独立缩放，一定铺满。代价是圆形变椭圆、文字被拉扁。' }
  ];

  var state = { dsl: null, mode: 'fluid', variant: 0, stage: { w: 800, h: 450 } };

  function toNum(s) {
    if (s == null) return null;
    var t = String(s).trim();
    if (CN[t] != null) return CN[t];
    var n = parseInt(t, 10);
    return isFinite(n) ? n : null;
  }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  function zoneLabels(n) {
    var preset = {
      1: ['内容区'],
      2: ['主视图', '辅助区'],
      3: ['指标区', '主视图', '列表区'],
      4: ['指标区', '主视图', '列表区', '详情区']
    };
    if (preset[n]) return preset[n].slice();
    var out = [];
    for (var i = 0; i < n; i++) out.push('区块 ' + (i + 1));
    return out;
  }

  function mkCols(specs) {
    return specs.map(function (s) {
      return {
        fr: s.fr == null ? 1 : s.fr,
        zones: zoneLabels(s.n).map(function (lb) { return { fr: 1, label: lb }; })
      };
    });
  }

  function parse(text) {
    var t = String(text || '').replace(/\s+/g, '');
    var dsl = {
      design: { w: 1920, h: 1080 },
      header: { enabled: false },
      footer: { enabled: false },
      variants: [],
      variantName: [],
      notes: []
    };

    var rm = t.match(/(\d{3,5})[x×*](\d{3,5})/i);
    if (rm) {
      dsl.design = { w: +rm[1], h: +rm[2] };
      dsl.notes.push('基准设计稿 ' + rm[1] + '×' + rm[2]);
    } else {
      dsl.notes.push('未指定分辨率，按 1920×1080 处理');
    }

    if (/头部|标题栏|顶栏|导航|标题区/.test(t)) dsl.header.enabled = true;
    if (/底部|底栏|页脚|状态栏/.test(t)) dsl.footer.enabled = true;

    var lr = t.match(new RegExp('左(?:边)?(' + NUMS + ')(?:栏|列|块|个|区).{0,8}?右(?:边)?(' + NUMS + ')(?:栏|列|块|个|区)'));
    var both = t.match(new RegExp('左右(?:两边)?各(' + NUMS + ')(?:栏|列|块|个|区)?'));
    var vert = t.match(new RegExp('(?:上下|纵向|竖直)(?:各|共|分)?(' + NUMS + ')(?:块|栏|区|个)'));
    var cols = t.match(new RegExp('(?:共|分)?(' + NUMS + ')(?:栏|列)(?:布局|结构|排布)?'));

    if (lr) {
      var L = clamp(toNum(lr[1]) || 1, 1, 6);
      var R = clamp(toNum(lr[2]) || 1, 1, 6);
      dsl.variants = [
        mkCols([{ fr: 1, n: L }, { fr: 1, n: R }]),
        mkCols([{ fr: 1, n: 1 }, { fr: 1, n: 1 }, { fr: 1, n: 1 }, { fr: 1, n: 1 }]).slice(0, L + R)
      ];
      dsl.variantName = ['左右各成一组，各组内部再分', '左右各拆成独立列'];
      dsl.notes.push('识别到「左 ' + L + ' / 右 ' + R + '」的分区意图');
    } else if (both) {
      var B = clamp(toNum(both[1]) || 2, 1, 6);
      dsl.variants = [mkCols([{ fr: 1, n: B }, { fr: 1, n: B }])];
      dsl.variantName = ['左右对称分组'];
      dsl.notes.push('识别到「左右各 ' + B + ' 个分区」');
    } else if (vert) {
      var V = clamp(toNum(vert[1]) || 3, 1, 6);
      dsl.variants = [mkCols([{ fr: 1, n: V }])];
      dsl.variantName = ['单列纵向堆叠'];
      dsl.notes.push('识别到纵向 ' + V + ' 段');
    } else if (cols) {
      var N = clamp(toNum(cols[1]) || 3, 1, 8);
      dsl.variants = [mkCols(new Array(N).fill(0).map(function () { return { fr: 1, n: 1 }; }))];
      dsl.variantName = [N + ' 列等分'];
      dsl.notes.push('识别到 ' + N + ' 列等分');
    } else {
      dsl.variants = [mkCols([{ fr: 1, n: 1 }, { fr: 1.6, n: 1 }, { fr: 1, n: 1 }])];
      dsl.variantName = ['三列经典大屏结构'];
      dsl.notes.push('结构描述不明确，先按三列经典结构给一版');
    }

    return dsl;
  }

  function screenHTML(dsl) {
    var cols = dsl.variants[state.variant] || dsl.variants[0];
    var body = cols.map(function (c) {
      var zones = c.zones.map(function (z) {
        return '<div class="zone" style="flex:' + z.fr + ' 1 0">' +
                 '<span class="dot"></span><span class="zl">' + z.label + '</span>' +
               '</div>';
      }).join('');
      return '<div class="col" style="flex:' + c.fr + ' 1 0"><div class="stack">' + zones + '</div></div>';
    }).join('');

    return (dsl.header.enabled ? '<div class="hf hf-top">头部 · 标题 / 导航</div>' : '') +
           '<div class="body">' + body + '</div>' +
           (dsl.footer.enabled ? '<div class="hf hf-bot">底部 · 状态栏</div>' : '');
  }

  function render() {
    var dsl = state.dsl;
    var stage = document.getElementById('stage');
    var host = document.getElementById('host');
    if (!dsl) return;

    stage.style.width = state.stage.w + 'px';
    stage.style.height = state.stage.h + 'px';

    var inner = screenHTML(dsl);

    if (state.mode === 'fluid') {
      host.innerHTML = '<div class="screen fluid">' + inner + '</div>';
    } else {
      var W = dsl.design.w, H = dsl.design.h;
      var vw = state.stage.w, vh = state.stage.h;
      var sx, sy;
      if (state.mode === 'contain') { sx = sy = Math.min(vw / W, vh / H); }
      else if (state.mode === 'cover') { sx = sy = Math.max(vw / W, vh / H); }
      else { sx = vw / W; sy = vh / H; }
      host.innerHTML = '<div class="screen fixed" style="width:' + W + 'px;height:' + H + 'px;' +
                       'transform:scale(' + sx + ',' + sy + ')">' + inner + '</div>';
    }
    updateHUD();
  }

  function updateHUD() {
    var dsl = state.dsl;
    if (!dsl) return;
    var w = state.stage.w, h = state.stage.h;
    var g = gcd(w, h);
    var ratio = (w / g) + ':' + (h / g);
    var base = dsl.design.w / dsl.design.h;
    var cur = w / h;
    var drift = Math.abs(cur - base) / base;
    var judge = drift < 0.01
      ? '<span class="ok">与设计稿同比例</span>'
      : '<span class="bad">偏离设计比例 ' + Math.round(drift * 100) + '%</span>';
    document.getElementById('hud').innerHTML =
      '<span>视口 <b>' + w + ' × ' + h + '</b></span>' +
      '<span><b>' + ratio + '</b></span>' + judge;
  }

  function gcd(a, b) {
    a = Math.round(Math.abs(a)); b = Math.round(Math.abs(b));
    while (b) { var t = b; b = a % b; a = t; }
    return a || 1;
  }

  function renderReadout() {
    var dsl = state.dsl;
    if (!dsl) return;
    var cols = dsl.variants[state.variant] || dsl.variants[0];
    var struct = cols.map(function (c) { return c.zones.length; }).join(' + ');
    var el = document.getElementById('readout');
    var modeName = (MODES.filter(function (m) { return m.id === state.mode; })[0] || {}).name;
    el.innerHTML =
      row('基准稿', dsl.design.w + ' × ' + dsl.design.h) +
      row('分区', '<em>' + struct + '</em> 个纵向区块 · 共 ' + cols.length + ' 大列') +
      row('适配', '<em>' + modeName + '</em>') +
      row('头尾', (dsl.header.enabled ? '头部' : '无头部') + ' / ' + (dsl.footer.enabled ? '底部' : '无底部')) +
      row('理解', dsl.variantName[state.variant] || '');
  }
  function row(k, v) {
    return '<div class="ro-row"><span class="ro-k">' + k + '</span><span class="ro-v">' + v + '</span></div>';
  }

  function renderModes() {
    var el = document.getElementById('modes');
    el.innerHTML = MODES.map(function (m) {
      return '<button class="mode' + (m.id === state.mode ? ' on' : '') + '" data-id="' + m.id + '">' +
               '<b>' + m.name + '</b>' + m.sub + '</button>';
    }).join('');
    var cur = MODES.filter(function (m) { return m.id === state.mode; })[0];
    document.getElementById('modeHint').textContent = cur ? cur.hint : '';
  }

  function fitStage() {
    var wrap = document.querySelector('.stage-wrap');
    var availW = Math.max(240, wrap.clientWidth - 110);
    var availH = Math.max(160, wrap.clientHeight - 110);
    var ar = state.dsl ? state.dsl.design.w / state.dsl.design.h : 16 / 9;
    var h = availH, w = h * ar;
    if (w > availW) { w = availW; h = w / ar; }
    state.stage = { w: Math.round(w), h: Math.round(h) };
  }

  function generate() {
    var text = document.getElementById('prompt').value;
    state.dsl = parse(text);
    state.variant = 0;
    document.getElementById('cbH').checked = state.dsl.header.enabled;
    document.getElementById('cbF').checked = state.dsl.footer.enabled;
    fitStage();
    renderReadout();
    render();
  }

  /* ---------- 交互绑定 ---------- */
  var CHIPS = [
    '1920×1080 自适应，左边两栏右边两栏',
    '超宽屏 3440×1440，左右各两栏，有头部',
    '四列布局 1920×1080',
    '1080×1920 竖屏，上下三块'
  ];
  document.getElementById('chips').innerHTML = CHIPS.map(function (c) {
    return '<button class="chip" data-v="' + c.replace(/"/g, '&quot;') + '">' + c + '</button>';
  }).join('');

  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    document.getElementById('prompt').value = b.dataset.v;
    generate();
  });

  document.getElementById('go').addEventListener('click', generate);
  document.getElementById('prompt').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') generate();
  });

  document.getElementById('alt').addEventListener('click', function () {
    if (!state.dsl || state.dsl.variants.length < 2) return;
    state.variant = (state.variant + 1) % state.dsl.variants.length;
    renderReadout();
    render();
  });

  document.getElementById('modes').addEventListener('click', function (e) {
    var b = e.target.closest('.mode');
    if (!b) return;
    state.mode = b.dataset.id;
    renderModes();
    renderReadout();
    render();
  });

  document.getElementById('cbH').addEventListener('change', function (e) {
    state.dsl.header.enabled = e.target.checked;
    renderReadout(); render();
  });
  document.getElementById('cbF').addEventListener('change', function (e) {
    state.dsl.footer.enabled = e.target.checked;
    renderReadout(); render();
  });

  /* ---------- 拖动改变视口比例 ---------- */
  var drag = null;
  var rs = document.getElementById('rs');
  rs.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, w: state.stage.w, h: state.stage.h };
    rs.setPointerCapture(e.pointerId);
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var wrap = document.querySelector('.stage-wrap');
    var maxW = Math.max(300, wrap.clientWidth - 60);
    var maxH = Math.max(200, wrap.clientHeight - 60);
    state.stage = {
      w: clamp(drag.w + (e.clientX - drag.x), 240, maxW),
      h: clamp(drag.h + (e.clientY - drag.y), 150, maxH)
    };
    render();
  });
  window.addEventListener('pointerup', function () { drag = null; });

  renderModes();
  generate();
})();
</script>
</body>
</html>
