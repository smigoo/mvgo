<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三分栏 (经典)-contain</title>
<!--
  由 mvgo 大屏布局编辑器导出 · 单文件、零外部依赖
  设计稿基准：1920 × 1080
  适配策略：contain
  整体等比缩放（contain）：多余方向留边，内容绝不裁切
  拖动浏览器窗口即可验证响应效果。
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#0a1628;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}

  /* ── 适配策略（由布局设置决定，只改盒子 / 只做等比缩放） ── */
  .screen-root{width:1920px;height:1080px;transform-origin:center center;transform:scale(min(calc(100vw / 1920), calc(100vh / 1080)));}

  .screen-root{
    display:flex;flex-direction:column;overflow:hidden;
    background:#ffffff;
    color:#1c2a3a;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  }
  .sl-header,.sl-footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid rgba(40, 90, 180, 0.3);
  }
  .sl-footer{border-bottom:none;border-top:1px solid rgba(40, 90, 180, 0.3);}
  .sl-hf-tag{font-size:11px;letter-spacing:.5px;color:rgba(40, 90, 180, 0.85);font-family:ui-monospace,Menlo,monospace;}
  .sl-body{
    flex:1 1 auto;min-height:0;display:flex;
    gap:8px;padding:8px 8px 8px 8px;
  }
  .sl-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .sl-zone{
    flex:1 1 0;min-height:0;min-width:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    border:1px dashed rgba(40, 90, 180, 0.42);border-radius:6px;
    background:rgba(56, 132, 255, 0.08);
  }
  .sl-hint{font-size:12px;color:rgba(40, 90, 180, 0.78);font-family:ui-monospace,Menlo,monospace;}
  .sl-comp{list-style:none;width:100%;padding:8px;display:flex;flex-direction:column;gap:6px;}
  .sl-comp li{
    font-size:12px;color:rgba(20, 45, 90, 0.9);
    background:rgba(56, 132, 255, 0.14);border-radius:4px;padding:4px 8px;
  }
</style>
</head>
<body>
  <div class="screen-root">
    <header class="sl-header" style="height:70px;background:rgba(20,30,80,0.9)">
      <span class="sl-hf-tag">HEADER 70px</span>
    </header>
    <main class="sl-body">
      <section class="sl-col" style="flex-grow:2">
        <div class="sl-zone" style="padding:8px 8px 8px 8px"><span class="sl-hint">1区1</span></div>
      </section>
      <section class="sl-col" style="flex-grow:8">
        <div class="sl-zone" style="padding:8px 8px 8px 8px"><span class="sl-hint">2区1</span></div>
      </section>
      <section class="sl-col" style="flex-grow:2">
        <div class="sl-zone" style="padding:8px 8px 8px 8px"><span class="sl-hint">3区1</span></div>
      </section>
    </main>
  </div>
</body>
</html>
