<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lite / Max 胶囊切换效果</title>
<style>
  /* ============ Design Tokens ============ */
  :root {
    /* 档位渐变（来自已确认的设计稿） */
    --lite-grad: linear-gradient(120deg, #D7F5E2 0%, #AEEAC9 48%, #7FE2D8 100%);
    --lite-text: #0B3A2A;
    --max-grad:  linear-gradient(135deg, #7C3AED 0%, #6D28D9 48%, #4C1D95 100%);
    --max-text:  #FFFFFF;

    /* 表面 / 中性 */
    --bg: #F6F8FB;
    --surface: #FFFFFF;
    --track: #EDF1F6;
    --track-border: #E2E8F0;
    --ink: #0F172A;
    --ink-soft: #64748B;
    --ink-faint: #94A3B8;
    --focus: #6D28D9;

    --r-pill: 999px;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --dur: .52s;
  }

  [data-theme="dark"] {
    --bg: #0B1020;
    --surface: #121A2E;
    --track: #1B2540;
    --track-border: #27324F;
    --ink: #E6ECF7;
    --ink-soft: #9AA7BD;
    --ink-faint: #6B7891;
    --focus: #A78BFA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #E8FBF1 0%, transparent 55%),
      radial-gradient(1000px 600px at 110% 10%, #EFE7FF 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 80px;
    transition: background .4s ease, color .4s ease;
  }

  .wrap { width: 100%; max-width: 560px; }

  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.01em;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 36px;
    line-height: 1.6;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--track-border);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
    margin-bottom: 22px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-faint);
    margin: 0 0 22px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  /* ============ 分段胶囊（核心） ============ */
  .seg {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 240px;
    padding: 6px;
    background: var(--track);
    border: 1px solid var(--track-border);
    border-radius: var(--r-pill);
    isolation: isolate;
    user-select: none;
  }
  .seg__thumb {
    position: absolute;
    top: 6px;
    left: 6px;
    width: calc(50% - 6px);
    height: calc(100% - 12px);
    border-radius: var(--r-pill);
    box-shadow: 0 6px 16px rgba(15, 23, 42, .14);
    transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    will-change: transform, opacity;
  }
  .seg__thumb--lite { background: var(--lite-grad); opacity: 1; }
  .seg__thumb--max  { background: var(--max-grad);  opacity: 0; }

  .seg.is-max .seg__thumb--lite { opacity: 0; }
  .seg.is-max .seg__thumb--max  { opacity: 1; }
  .seg.is-max .seg__thumb--lite,
  .seg.is-max .seg__thumb--max  { transform: translateX(100%); }

  .seg__opt {
    position: relative;
    z-index: 1;
    appearance: none;
    border: 0;
    background: transparent;
    cursor: pointer;
    font: 600 14px/1 inherit;
    letter-spacing: .02em;
    padding: 12px 0;
    color: var(--ink-soft);
    transition: color var(--dur) var(--ease);
  }
  .seg__opt.is-on[data-val="lite"] { color: var(--lite-text); }
  .seg__opt.is-on[data-val="max"]  { color: var(--max-text); }
  .seg__opt:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
    border-radius: 10px;
  }
  .seg:active .seg__thumb { filter: brightness(.97); }

  /* 紧凑尺寸 */
  .seg.compact { width: 168px; }
  .seg.compact .seg__opt { font-size: 13px; padding: 9px 0; }

  /* ============ iOS 风格开关变体 ============ */
  .switch {
    position: relative;
    width: 92px;
    height: 46px;
    border-radius: var(--r-pill);
    border: 1px solid var(--track-border);
    cursor: pointer;
    padding: 0;
    isolation: isolate;
    transition: transform .15s ease;
  }
  .switch:active { transform: scale(.97); }
  .switch:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .switch__bg {
    position: absolute; inset: 0; border-radius: var(--r-pill);
    transition: opacity var(--dur) var(--ease);
  }
  .switch__bg--lite { background: var(--lite-grad); opacity: 1; }
  .switch__bg--max  { background: var(--max-grad);  opacity: 0; }
  .switch.is-max .switch__bg--lite { opacity: 0; }
  .switch.is-max .switch__bg--max  { opacity: 1; }
  .switch__knob {
    position: absolute;
    top: 4px; left: 4px;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 10px rgba(15, 23, 42, .25);
    transition: transform var(--dur) var(--ease);
    z-index: 1;
  }
  .switch.is-max .switch__knob { transform: translateX(46px); }

  /* ============ 状态读数 ============ */
  .readout {
    margin-top: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: var(--r-pill);
    color: #fff;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .chip.lite { background: var(--lite-grad); color: var(--lite-text); }
  .chip.max  { background: var(--max-grad);  color: var(--max-text); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; }

  .theme-btn {
    margin-top: 4px;
    align-self: flex-end;
    appearance: none;
    border: 1px solid var(--track-border);
    background: var(--surface);
    color: var(--ink-soft);
    font: 600 13px/1 inherit;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .theme-btn:hover { color: var(--ink); }
  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 14px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Lite / Max 胶囊切换</h1>
    <p class="sub">薄荷→青绿（Lite）与紫渐变（Max）双档位。滑块在切换时平滑滑动并做渐变 morph，标签文字随档位反色。</p>

    <div class="panel">
      <h2>分段胶囊 · Segmented</h2>
      <div class="row">
        <div class="seg" id="seg" role="radiogroup" aria-label="档位切换">
          <span class="seg__thumb seg__thumb--lite"></span>
          <span class="seg__thumb seg__thumb--max"></span>
          <button class="seg__opt is-on" data-val="lite" role="radio" aria-checked="true">Lite</button>
          <button class="seg__opt" data-val="max" role="radio" aria-checked="false">Max</button>
        </div>
      </div>
      <div class="readout">
        当前：<span class="chip lite" id="chip"><span class="dot"></span><span id="chipText">Lite</span></span>
      </div>
      <p class="hint">点击或方向键 ← → 切换</p>
    </div>

    <div class="panel">
      <h2>紧凑尺寸 · Compact</h2>
      <div class="row">
        <div class="seg compact" data-mini role="radiogroup" aria-label="档位切换">
          <span class="seg__thumb seg__thumb--lite"></span>
          <span class="seg__thumb seg__thumb--max"></span>
          <button class="seg__opt is-on" data-val="lite" role="radio" aria-checked="true">Lite</button>
          <button class="seg__opt" data-val="max" role="radio" aria-checked="false">Max</button>
        </div>
      </div>
    </div>

    <div class="panel" data-theme="dark" style="background:var(--surface)">
      <h2>开关变体 · Switch（深色底）</h2>
      <div class="row">
        <button class="switch" id="sw" role="switch" aria-checked="false" aria-label="档位开关">
          <span class="switch__bg switch__bg--lite"></span>
          <span class="switch__bg switch__bg--max"></span>
          <span class="switch__knob"></span>
        </button>
      </div>
      <p class="hint">关 = Lite（薄荷）· 开 = Max（紫）</p>
    </div>

    <button class="theme-btn" id="themeBtn">切换深色 / 浅色</button>
  </div>

<script>
  function bindSeg(seg) {
    const opts = seg.querySelectorAll('.seg__opt');
    function set(val) {
      const max = val === 'max';
      seg.classList.toggle('is-max', max);
      opts.forEach(o => {
        const on = o.dataset.val === val;
        o.classList.toggle('is-on', on);
        o.setAttribute('aria-checked', on);
      });
    }
    opts.forEach(o => o.addEventListener('click', () => set(o.dataset.val)));
    seg.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const cur = seg.querySelector('.seg__opt.is-on').dataset.val;
        set(cur === 'lite' ? 'max' : 'lite');
      }
    });
  }

  document.querySelectorAll('.seg').forEach(bindSeg);

  // 主分段 -> 同步读数
  const seg = document.getElementById('seg');
  const chip = document.getElementById('chip');
  const chipText = document.getElementById('chipText');
  const sync = () => {
    const max = seg.classList.contains('is-max');
    chip.className = 'chip ' + (max ? 'max' : 'lite');
    chipText.textContent = max ? 'Max' : 'Lite';
  };
  seg.addEventListener('click', sync);
  seg.addEventListener('keydown', sync);

  // 开关变体
  const sw = document.getElementById('sw');
  sw.addEventListener('click', () => {
    const max = !sw.classList.contains('is-max');
    sw.classList.toggle('is-max', max);
    sw.setAttribute('aria-checked', max);
  });

  // 主题切换
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    const dark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
</script>
</body>
</html>
