version: '3.8'

# ============================================================
# 感智晓界 — 本地开发/测试 docker-compose
# ============================================================
# 使用方式：
#   docker compose up -d              # 启动全部服务
#   docker compose up -d frontend     # 仅启动前端
#   docker compose logs -f backend-java
# ============================================================

services:
  # ─── Nginx 统一入口 ───
  nginx:
    image: nginx:alpine
    container_name: mvgo-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend-node
      - backend-java
    restart: unless-stopped

  # ─── MySQL ───
  mysql:
    image: mysql:8.0
    container_name: mvgo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mvgo
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # ─── Vue3 前端 ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mvgo-frontend
    ports:
      - "2610:2610"
    restart: unless-stopped
    # 开发模式可直接 mount 源码：
    # volumes:
    #   - ./frontend/src:/app/src

  # ─── Node.js 后端（AI 引擎 + Figma 管线 + SSE） ───
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: mvgo-backend-node
    ports:
      - "13030:13030"
    env_file:
      - ./backend-node/.env
    environment:
      # 容器内通过服务名访问 Java（host 开发模式走代码默认 localhost:8080）
      JAVA_BACKEND_URL: http://backend-java:8080/api
    depends_on:
      - mysql
    restart: unless-stopped

  # ─── Java 后端（业务 CRUD，持久化走 MongoDB，不接 MySQL） ───
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: mvgo-backend-java
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 生产部署必须注入 MONGODB_URI（与 Node 共用同一库，含账号密码）。
      # 例如：mongodb://root:***@dds-xxx.mongodb.rds.aliyuncs.com:3717/langgraph-server?replicaSet=...&authSource=admin
      # 未注入时回退到默认值（仅本地/测试可用，生产务必覆盖）。
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/langgraph-server}
      NODE_BACKEND_URL: http://backend-node:13030/api
    depends_on:
      - backend-node
    restart: unless-stopped

volumes:
  mysql_data:
